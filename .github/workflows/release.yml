name: Draft Release on Merge

on:
  push:
    branches:
      - main
      - master

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch All Tags
        run: git fetch --tags --force

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.4.2")
          BASE_VERSION=$(echo $LATEST_TAG | sed 's/^v//')
          NEW_PATCH=$(( $(echo $BASE_VERSION | cut -d. -f3) + 1 ))
          MAJOR_MINOR=$(echo $BASE_VERSION | cut -d. -f1,2)
          NEXT_TAG="v${MAJOR_MINOR}.${NEW_PATCH}"

          gh release create "$NEXT_TAG" --draft --generate-notes --notes-start-tag "$LATEST_TAG"
